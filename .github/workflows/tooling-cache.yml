name: Tooling cache (temporary)

# Helper for development sessions without direct access to dl.google.com: packs the parts of the
# Android SDK and the Gradle dependency cache this project needs and publishes them as a
# prerelease, so a sandboxed machine can build offline. "cleanup" removes that prerelease again.
on:
  push:
    paths: ['.github/workflows/tooling-cache.yml']
  workflow_dispatch:
    inputs:
      action:
        description: "publish the SDK + Gradle cache as a prerelease, or cleanup (delete it)"
        type: choice
        options: [publish, cleanup]
        default: publish


permissions:
  contents: write

jobs:
  publish:
    if: ${{ !contains(github.event.head_commit.message, '[tooling-cleanup]') && (github.event_name != 'workflow_dispatch' || inputs.action == 'publish') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # no setup-gradle here: a plain ~/.gradle, so the tar holds every module the build resolves
      # failures do not matter here: the dependencies are resolved either way
      - name: Resolve and build everything once
        run: ./gradlew --no-daemon --continue -PwithX86 testDebugUnitTest assembleDebug assembleRelease assembleDebugAndroidTest || echo "build failed; packing what was resolved"

      - name: Pack SDK and Gradle modules
        run: |
          set -e
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "SDK=$SDK"
          ls "$SDK" "$SDK/platforms" "$SDK/build-tools"
          members=""
          for m in platforms/android-35 build-tools/35.0.0 platform-tools licenses; do
            [ -e "$SDK/$m" ] && members="$members $m" || echo "missing $m"
          done
          tar -C "$SDK" -czf sdk.tar.gz $members
          tar -C "$HOME/.gradle/caches" -czf gradle-modules.tar.gz modules-2
          ls -la *.tar.gz

      - name: Upload as prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view tooling-cache >/dev/null 2>&1 || \
            gh release create tooling-cache --prerelease --target "${{ github.sha }}" \
              --title "CI tooling cache (tạm thời)" \
              --notes "Bộ nhớ đệm công cụ build (Android SDK + Gradle) dùng tạm cho phiên phát triển; sẽ được xoá."
          gh release upload tooling-cache sdk.tar.gz gradle-modules.tar.gz --clobber

  cleanup:
    if: ${{ contains(github.event.head_commit.message, '[tooling-cleanup]') || (github.event_name == 'workflow_dispatch' && inputs.action == 'cleanup') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete tooling-cache --yes --cleanup-tag || true
