name: Build APK & IPA

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.7'

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Giữ cùng một khoá ký giữa các lần build để cài đè bản mới không phải gỡ app.
      - name: Cache debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - name: Rename APK
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/P2PMeet-${VERSION}-build${{ github.run_number }}.apk"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/*.apk
          if-no-files-found: error

  ios:
    name: iOS IPA
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build iOS (không ký)
        run: flutter build ios --release --no-codesign

      - name: Đóng gói IPA
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')
          test -d build/ios/iphoneos/Runner.app/PlugIns/BroadcastExtension.appex
          mkdir -p dist/Payload
          cp -R build/ios/iphoneos/Runner.app dist/Payload/
          cd dist && zip -qry "P2PMeet-${VERSION}-build${{ github.run_number }}-unsigned.ipa" Payload && rm -rf Payload
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: dist/*.ipa
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Tạo release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: P2P Meet build ${{ github.run_number }}
          body: |
            Bộ cài P2P Meet (commit ${{ github.sha }}).

            - **Android**: tải file `.apk`, mở để cài (cho phép "Cài ứng dụng không rõ nguồn gốc").
            - **iOS**: file `.ipa` chưa ký — cài bằng Sideloadly / AltStore / Xcode với Apple ID của bạn.
          files: dist/*
