name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the APKs as a GitHub release"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build APKs
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: cam-scaner-apk
          path: app/build/outputs/apk/**/*.apk

  device-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build app and test APKs
        run: ./gradlew --no-daemon -PwithX86 assembleDebug assembleDebugAndroidTest

      - name: Instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated
          disable-animations: true
          script: |
            adb shell rm -rf /sdcard/Pictures/camscaner || true
            adb shell settings put global hide_error_dialogs 1 || true
            adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS || true
            ./gradlew --no-daemon -PwithX86 connectedDebugAndroidTest > connected.log 2>&1; echo $? > exit_code.txt
            grep -E "Tests on|FAILED" connected.log | head -n 60 || true
            grep -A 30 "FAILED" connected.log | head -n 400 || true
            adb pull /sdcard/Pictures/camscaner screenshots || true
            adb logcat -d > logcat.txt || true
            grep -E "CamScanerTest|FilterScreen|AppNavigation|CameraScreen|AutoAligner|ScanSession|AndroidRuntime" logcat.txt | head -n 400 || true
            grep -A 40 "FATAL EXCEPTION" logcat.txt | head -n 200 || true
            exit $(cat exit_code.txt)

      - name: Commit screenshots
        if: always() && github.event_name == 'push' && contains(github.event.head_commit.message, '[screens]')
        run: |
          pip install --quiet pillow
          rm -rf docs/screenshots && mkdir -p docs/screenshots
          python3 - <<'PY'
          import glob, os
          from PIL import Image
          for p in sorted(glob.glob('screenshots/**/*.png', recursive=True)):
              im = Image.open(p).convert('RGB')
              w = 360
              im = im.resize((w, int(im.height * w / im.width)), Image.LANCZOS)
              im.save('docs/screenshots/' + os.path.basename(p)[:-4] + '.jpg', 'JPEG', quality=72)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf /tmp/shots && cp -r docs/screenshots /tmp/shots
          for i in 1 2 3; do
            git fetch -q origin "${GITHUB_REF_NAME}"
            git checkout -q -f -B shots "origin/${GITHUB_REF_NAME}"
            rm -rf docs/screenshots && mkdir -p docs && cp -r /tmp/shots docs/screenshots
            git add -A docs/screenshots
            git commit -q -m "Update emulator screenshots [skip ci]" || exit 0
            git push -q origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep 5
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-test-results
          path: |
            screenshots/
            logcat.txt
            connected.log
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: [build, device-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cam-scaner-apk
          path: apk

      - name: Collect APKs
        run: |
          mkdir dist
          cp apk/release/app-release.apk "dist/CamScaner-1.0.${{ github.run_number }}.apk"
          cp apk/debug/app-debug.apk "dist/CamScaner-1.0.${{ github.run_number }}-debug.apk"
          ls -la dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Cam Scaner 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: dist/*.apk
          body: |
            APK quét tài liệu ra PDF.
            - `CamScaner-1.0.${{ github.run_number }}.apk`: bản chính thức (đã tối ưu, nhỏ gọn) — cài bản này.
            - `...-debug.apk`: bản gỡ lỗi.
