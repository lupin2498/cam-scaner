[versions]
agp = "8.7.3"
kotlin = "2.0.21"
coreKtx = "1.15.0"
activityCompose = "1.9.3"
composeBom = "2024.12.01"
lifecycle = "2.8.7"
navigation = "2.8.5"
camerax = "1.4.1"
exifinterface = "1.3.7"
coroutines = "1.9.0"
coil = "2.7.0"
opencv = "4.10.0"
pdfbox = "2.0.27.0"
mlkitText = "16.0.1"
reorderable = "2.4.3"
junit = "4.13.2"
androidxTestRunner = "1.6.2"
androidxTestRules = "1.6.1"
